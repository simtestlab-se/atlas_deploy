name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [ main ]   # or "master" if that's your default branch
  workflow_dispatch:      # allow manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🧩 Step 1: Checkout repository including submodules
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 🐍 Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 📦 Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install mkdocs mkdocs-material mkdocs-awesome-pages-plugin mkdocs-git-revision-date-localized-plugin mkdocs-git-authors-plugin mkdocs-puml

      # 🏗️ Step 4: Build site (for validation)
      - name: Build MkDocs site
        run: |
          echo "Building MkDocs site..."
          mkdocs build --verbose

      # 🚀 Step 5: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deploying site to gh-pages branch..."
          mkdocs gh-deploy --force --verbose
