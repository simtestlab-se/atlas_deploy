name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [ main ]        # Adjust if your default branch is different
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🧩 Step 1: Checkout the repository (including submodules)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 🐍 Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 📦 Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install mkdocs mkdocs-material mkdocs-awesome-pages-plugin \
                      mkdocs-git-revision-date-localized-plugin \
                      mkdocs-git-authors-plugin mkdocs-puml mkdocs-charts-plugin

      # 🏗️ Step 4: Build MkDocs site (to ensure it compiles)
      - name: Build MkDocs site
        run: |
          echo "Building MkDocs documentation..."
          mkdocs build --verbose

      # 🚀 Step 5: Deploy to GitHub Pages using personal token
      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.atlas_token }}
        run: |
          echo "Deploying to GitHub Pages..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --verbose
